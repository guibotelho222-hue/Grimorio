[tool.flet]
org = "com.grimorio"
product = "Grimorio"

[tool.flet.app]
path = "main.py"
assets_dir = "assets"

[tool.flet.android]
icon = "assets/icon.png"

# Garante que scripts dentro de pastas sejam incluídos
[tool.flet.package]
include = [
    "*.py",
    "components/*.py",
    "components/*/*.py",
    "tabs/*.py",
    "assets/*"
]
